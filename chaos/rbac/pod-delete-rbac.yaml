# ServiceAccount the pod-delete runner/experiment pods run as in the target namespace.
# Written for "shop"; scripts/dev-cluster.sh applies it to each chaos namespace by
# substituting the namespace (shop, resilience-sandbox).
# Namespaced Role (not the upstream cluster-wide litmus-admin): chaos can only touch
# pods in this namespace. Workload kinds are read-only (used for target/health checks).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autoresilience-chaos
  namespace: shop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: autoresilience-chaos
  namespace: shop
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "get", "list", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["replicationcontrollers"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete", "deletecollection"]
  - apiGroups: ["litmuschaos.io"]
    resources: ["chaosengines", "chaosexperiments", "chaosresults"]
    verbs: ["create", "get", "list", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: autoresilience-chaos
  namespace: shop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: autoresilience-chaos
subjects:
  - kind: ServiceAccount
    name: autoresilience-chaos
    namespace: shop
