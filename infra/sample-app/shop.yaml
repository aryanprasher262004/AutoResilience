# Sample "shop" microservices used as chaos targets in local development.
# Replica counts are chosen so blast-radius checks have both passing and failing cases:
#   frontend 3, checkout 2, cart-redis 1 (single replica: any pod fault leaves 0 healthy).
# Only checkout (podinfo) exposes server-side request metrics (http_requests_total{status}).
# loadgen sends real traffic to checkout and frontend and exports the client's view
# (loadgen_requests_total{target_namespace,target_workload,outcome}).
# cart-redis has neither.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shop
  labels: {app: frontend}
spec:
  replicas: 3
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: shop
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: shop
  labels: {app: checkout}
spec:
  replicas: 2
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels: {app: checkout}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9797"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.9.2
          command: ["./podinfo", "--port=9898", "--port-metrics=9797", "--level=info"]
          ports:
            - {name: http, containerPort: 9898}
            - {name: metrics, containerPort: 9797}
          readinessProbe:
            httpGet: {path: /readyz, port: 9898}
          livenessProbe:
            httpGet: {path: /healthz, port: 9898}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: shop
spec:
  selector: {app: checkout}
  ports: [{port: 80, targetPort: 9898}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cart-redis
  namespace: shop
  labels: {app: cart-redis}
spec:
  serviceName: cart-redis
  replicas: 1
  selector:
    matchLabels: {app: cart-redis}
  template:
    metadata:
      labels: {app: cart-redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: cart-redis
  namespace: shop
spec:
  clusterIP: None
  selector: {app: cart-redis}
  ports: [{port: 6379}]
---
# Client-side load generator (infra/sample-app/loadgen/loadgen.py, mounted from the
# loadgen-script ConfigMap that scripts/dev-cluster.sh creates). Sends 10 req/s per
# target over a new connection each time and exports what the client experienced
# (success / http_error / connection_error / timeout, latency) on :9100/metrics.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: shop
  labels: {app: loadgen}
spec:
  replicas: 1
  selector:
    matchLabels: {app: loadgen}
  template:
    metadata:
      labels: {app: loadgen}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: loadgen
          image: python:3.12.11-alpine3.22
          command: ["python", "-u", "/app/loadgen.py"]
          env:
            - {name: TARGETS, value: "shop/checkout=http://checkout/;shop/frontend=http://frontend/"}
            - {name: INTERVAL_SECONDS, value: "0.1"}
            - {name: TIMEOUT_SECONDS, value: "1"}
          ports: [{name: metrics, containerPort: 9100}]
          readinessProbe:
            httpGet: {path: /metrics, port: 9100}
          volumeMounts:
            - {name: script, mountPath: /app}
          resources:
            requests: {cpu: 20m, memory: 24Mi}
            limits: {memory: 64Mi}
      volumes:
        - name: script
          configMap: {name: loadgen-script}
